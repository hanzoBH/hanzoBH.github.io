<audio controls style="width: 100%; max-width: 400px;">
  <source src="Before It Could Begin.mp3" type="audio/mpeg">
  Trình duyệt của bạn không hỗ trợ phát âm thanh.

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Vẽ Pixel 400x400</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #181825;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    .toolbar {
      background-color: #11111b;
      padding: 10px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #313244;
      z-index: 10;
      flex-wrap: wrap;
    }
    .tools-group { display: flex; align-items: center; gap: 8px; }
    label { font-size: 13px; color: #a6adc8; }
    input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }
    button {
      background-color: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    button:hover { background-color: #45475a; }
    button.active {
      background-color: #89b4fa;
      color: #11111b;
      font-weight: bold;
    }
    .coords { font-size: 12px; color: #a6adc8; margin-left: auto; }

    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      background-color: #181825;
    }
    
    /* Container để đồng bộ Canvas Vẽ và Canvas Lưới */
    #canvasContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 400px;
      height: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      
    }
    #gridCanvas { pointer-events: none; } /* Không cản trở click chuột */
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="tools-group">
      <label for="colorPicker">Màu:</label>
      <input type="color" id="colorPicker" value="#f38ba8">
    </div>
    <button id="btnPencil" class="active">✏️ Bút vẽ</button>
    <button id="btnEraser">🧹 Cục tẩy</button>
    <button id="btnToggleGrid">🌐 Bật/Tắt Lưới</button>
    <button id="btnReset">🎯 Về giữa</button>
    <button id="btnClear">🗑️️ Xóa sạch</button>
    <span class="coords" id="coords">Pixel: (0, 0) | Zoom: 100%</span>
  </div>

  <div id="viewport">
    <div id="canvasContainer">
      <canvas id="pixelCanvas" width="400" height="400"></canvas>
      <canvas id="gridCanvas" width="400" height="400"></canvas>
    </div>
  </div>

  <script>
    const GRID_SIZE = 400; // Đã đổi thành 400x400
    
    const container = document.getElementById('canvasContainer');
    ctx.imageSmoothingEnabled = false;
ctx.webkitImageSmoothingEnabled = false;
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const gridCanvas = document.getElementById('gridCanvas');
    const gridCtx = gridCanvas.getContext('2d');
    
    const viewport = document.getElementById('viewport');
    const colorPicker = document.getElementById('colorPicker');
    const coordsDisplay = document.getElementById('coords');

    let scale = 1;
    let panX = 0, panY = 0;
    let isPanning = false, isDrawing = false;
    let startX = 0, startY = 0;
    
    let isEraser = false;
    let showGrid = false;

    // Nền trắng mặc định
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, GRID_SIZE, GRID_SIZE);

    // Vẽ đường lưới Pixel
    function drawGrid() {
      gridCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
      if (!showGrid || scale < 2) return; // Chỉ hiển thị lưới khi zoom đủ to (>= 400%)

      gridCtx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
      gridCtx.lineWidth = 0.05;

      for (let i = 0; i <= GRID_SIZE; i++) {
        gridCtx.beginPath();
        gridCtx.moveTo(i, 0);
        gridCtx.lineTo(i, GRID_SIZE);
        gridCtx.stroke();

        gridCtx.beginPath();
        gridCtx.moveTo(0, i);
        gridCtx.lineTo(GRID_SIZE, i);
        gridCtx.stroke();
      }
    }

    function centerCanvas() {
      const rect = viewport.getBoundingClientRect();
      scale = Math.min(rect.width / GRID_SIZE, rect.height / GRID_SIZE) * 0.8;
      panX = (rect.width - GRID_SIZE * scale) / 2;
      panY = (rect.height - GRID_SIZE * scale) / 2;
      updateTransform();
    }

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      container.style.transformOrigin = '0 0';
      coordsDisplay.innerText = `Zoom: ${Math.round(scale * 100)}%`;
      drawGrid();
    }

    function getPixelCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / scale);
      const y = Math.floor((e.clientY - rect.top) / scale);
      return { x, y };
    }

    function drawPixel(x, y) {
      if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
        ctx.fillStyle = isEraser ? '#ffffff' : colorPicker.value;
        ctx.fillRect(x, y, 1, 1);
      }
    }

    // --- Sự kiện chuột ---
    viewport.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isDrawing = true;
        const { x, y } = getPixelCoords(e);
        drawPixel(x, y);
      } else if (e.button === 1 || e.button === 2) {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      const { x, y } = getPixelCoords(e);
      if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
        coordsDisplay.innerText = `Pixel: (${x}, ${y}) | Zoom: ${Math.round(scale * 100)}%`;
      }

      if (isDrawing) {
        drawPixel(x, y);
      } else if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      isDrawing = false;
      isPanning = false;
    });

    viewport.addEventListener('contextmenu', e => e.preventDefault());

    // Zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
      newScale = Math.max(0.5, Math.min(newScale, 200));

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }, { passive: false });

    // --- Các nút điều khiển ---
    const btnPencil = document.getElementById('btnPencil');
    const btnEraser = document.getElementById('btnEraser');

    btnPencil.addEventListener('click', () => {
      isEraser = false;
      btnPencil.classList.add('active');
      btnEraser.classList.remove('active');
    });

    btnEraser.addEventListener('click', () => {
      isEraser = true;
      btnEraser.classList.add('active');
      btnPencil.classList.remove('active');
    });

    document.getElementById('btnToggleGrid').addEventListener('click', (e) => {
      showGrid = !showGrid;
      e.target.classList.toggle('active', showGrid);
      drawGrid();
    });

    document.getElementById('btnReset').addEventListener('click', centerCanvas);
    document.getElementById('btnClear').addEventListener('click', () => {
      if (confirm('Xóa sạch bảng vẽ?')) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, GRID_SIZE, GRID_SIZE);
      }
    });

    centerCanvas();
  </script>
</body>
</html>
