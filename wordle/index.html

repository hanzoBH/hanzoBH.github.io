<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thông tin học sinh</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            width: 750px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .list-section {
            width: 45%;
            border-right: 1px solid #eaeaea;
            padding: 25px;
            box-sizing: border-box;
        }
        .detail-section {
            width: 55%;
            padding: 25px;
            box-sizing: border-box;
            background: #fafbfc;
        }
        h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 18px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f1f4f8;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #333;
        }
        li:hover {
            background: #3498db;
            color: #fff;
            transform: translateX(3px);
        }
        .info-card p {
            margin: 12px 0;
            color: #555;
            font-size: 15px;
        }
        .info-card strong {
            color: #2c3e50;
            display: inline-block;
            width: 100px;
        }
        .placeholder {
            color: #888;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cột danh sách học sinh -->
        <div class="list-section">
            <h3>Danh sách học sinh</h3>
            <ul id="student-list"></ul>
        </div>

        <!-- Cột hiển thị chi tiết thông tin -->
        <div class="detail-section">
            <h3>Thông tin chi tiết</h3>
            <div id="student-detail" class="info-card">
                <p class="placeholder">Bấm vào tên học sinh bên trái để xem thông tin chi tiết.</p>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu (mô phỏng đối tượng Học Sinh)
        const students = [
            { id: "HS001", name: "Nguyễn Hoàng Huy", age: 17, class: "12A1", address: "Tây Ninh", hobby: "Lập trình web, Chơi game" },
            { id: "HS002", name: "Trần Thị Bích Ngọc", age: 17, class: "12A1", address: "Tây Ninh", hobby: "Đọc sách, Nghe nhạc" },
            { id: "HS003", name: "Lê Minh Quân", age: 17, class: "12A2", address: "TP. Hồ Chí Minh", hobby: "Đá bóng, Thiết kế đồ họa" },
            { id: "HS004", name: "Phạm Thu Thảo", age: 17, class: "12A3", address: "Long An", hobby: "Nấu ăn, Vẽ tranh" }
        ];

        const listEl = document.getElementById('student-list');
        const detailEl = document.getElementById('student-detail');

        // Tạo danh sách học sinh động lên giao diện
        students.forEach(student => {
            const li = document.createElement('li');
            li.textContent = student.name;
            
            // Bắt sự kiện khi click vào tên học sinh
            li.addEventListener('click', () => {
                detailEl.innerHTML = `
                    <p><strong>Mã HS:</strong> ${student.id}</p>
                    <p><strong>Họ và tên:</strong> ${student.name}</p>
                    <p><strong>Tuổi:</strong> ${student.age}</p>
                    <p><strong>Lớp:</strong> ${student.class}</p>
                    <p><strong>Địa chỉ:</strong> ${student.address}</p>
                    <p><strong>Sở thích:</strong> ${student.hobby}</p>
                `;
            });
            
            listEl.appendChild(li);
        });
    </script>

</body>
</html>
